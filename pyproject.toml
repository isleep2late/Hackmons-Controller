[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "controllerlog"
version = "0.2.0"
description = "Connect, log, display, replay and TAS-edit game controller input (BlueRetro-inspired, GSE/BizHawk compatible)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"  # compression.zstd (GSE .gm2 logs, bk2 save RAM)
dependencies = [
    "aiohttp>=3.9",
    "pillow>=10",
    "vgamepad>=0.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
video = ["imageio-ffmpeg>=0.5"]
ble = ["bleak>=3.0"]
usb = ["pyusb>=1.2", "libusb-package>=1.0.26", "hidapi>=0.14"]
all = ["imageio-ffmpeg>=0.5", "bleak>=3.0", "pyusb>=1.2", "libusb-package>=1.0.26", "hidapi>=0.14"]
dev = ["pytest>=8", "lupa>=2"]

[project.scripts]
controllerlog = "controllerlog.cli:main"

[tool.setuptools.packages.find]
include = ["controllerlog*"]

[tool.setuptools.package-data]
controllerlog = ["layouts/*.json", "overlay/web/*", "overlay/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "vigem: needs the ViGEmBus driver (virtual controller) installed",
    "sdl: needs the SDL3 runtime library",
    "adb: needs adb and an Android device",
]
